<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
  body {background:#0a0a0a; color:#fff; font-family:Arial; padding:20px;}
  table {width:100%; border-collapse:collapse; background:#1e1e1e; margin-top:20px;}
  th,td {padding:12px; border-bottom:1px solid #333; text-align:left;}
  th{background:#2a2a2a; color:#fbbc05;}
  .btn-reset{background:#ff4444; border:none; padding:8px 12px; color:#fff; border-radius:6px; cursor:pointer;}
  h1{color:#fbbc05;}
</style>
</head>
<body>
<h1>All Users</h1>
<table>
<thead><tr><th>Email</th><th>Phone</th><th>Action</th></tr></thead>
<tbody id="userBody"><tr><td colspan="3">Loading...</td></tr></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyD3i_ow0g3LSAPiF7FMFR4v0yMxgAAUN9o",
  authDomain: "vediosreels-17b90.firebaseapp.com",
  projectId: "vediosreels-17b90"
});
const db = getFirestore(app);
const auth = getAuth(app);

const docs = await getDocs(collection(db, "users"));
let html = "";
docs.forEach(d => {
  const data = d.data();
  html += `<tr><td>${data.email}</td><td>${data.phone||"N/A"}</td>
  <td><button class="btn-reset" onclick="reset('${data.email}')">Reset Pass</button></td></tr>`;
});
document.getElementById("userBody").innerHTML = html || "<tr><td colspan='3'>No users yet</td></tr>";

window.reset = async (email) => {
  await sendPasswordResetEmail(auth, email);
  alert("Reset link sent to " + email);
}
</script>
</body>
</html>
